name: Playwright E2E Regression Suite

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  regression-test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Setup Node.js Environment
      uses: actions/setup-node@v4
      with:
        node-version: 18
        cache: 'npm'

    - name: Install Framework Dependencies
      run: npm ci

    - name: Install Playwright Web Browsers
      run: npx playwright install --with-deps chromium

    - name: Execute Full End-to-End Pipeline
      run: npx playwright test tests/playwright/comprehensiveSuite.spec.ts
      env:
        BASE_URL: https://automationexercise.com

    - name: Upload Dynamic Test HTML Reports & Screenshots
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-execution-report
        path: playwright-report/
        retention-days: 14
